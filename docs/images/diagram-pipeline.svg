<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 380" width="1000" height="380" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <title>The SDLC CAPM pipeline: MUFG's PDLC Planning deliverables, each behind a review gate, then the Planview/PPP files</title>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0L10 5L0 10z" fill="#64748b"/>
    </marker>
    <g id="gate">
      <path d="M0 -11L11 0L0 11L-11 0z" fill="#15803d"/>
      <path d="M-4.5 0.5l3 3l6 -6.5" fill="none" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
    </g>
  </defs>

  <rect x="0" y="0" width="1000" height="380" rx="12" fill="#f8fafc"/>

  <!-- Row 1 -->
  <rect x="20" y="56" width="160" height="72" rx="8" fill="#ffffff" stroke="#94a3b8" stroke-dasharray="5 4"/>
  <text x="100" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">Inputs</text>
  <text x="100" y="107" text-anchor="middle" font-size="11.5" fill="#64748b">Notes, calls, sheets, Figma</text>

  <rect x="220" y="56" width="160" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="300" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">1  Intake and gaps</text>
  <text x="300" y="107" text-anchor="middle" font-size="11.5" fill="#64748b">Project manager · Word</text>

  <rect x="420" y="56" width="160" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="500" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">2  BRD</text>
  <text x="500" y="107" text-anchor="middle" font-size="11.5" fill="#64748b">Business analyst · Excel</text>

  <rect x="620" y="56" width="160" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="700" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">3  FDD</text>
  <text x="700" y="107" text-anchor="middle" font-size="11.5" fill="#64748b">IT lead · Excel</text>

  <rect x="820" y="56" width="160" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="900" y="86" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">4  DRD / DSD</text>
  <text x="900" y="107" text-anchor="middle" font-size="11.5" fill="#64748b">IT lead · Excel</text>

  <line x1="180" y1="92" x2="216" y2="92" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="380" y1="92" x2="416" y2="92" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="92" x2="616" y2="92" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="780" y1="92" x2="816" y2="92" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <use href="#gate" x="400" y="92"/>
  <use href="#gate" x="600" y="92"/>
  <use href="#gate" x="800" y="92"/>

  <!-- Return to row 2 -->
  <path d="M900 128V160H100V188" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <use href="#gate" x="900" y="146"/>

  <!-- Row 2 -->
  <rect x="20" y="192" width="160" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="100" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">5  TDD</text>
  <text x="100" y="243" text-anchor="middle" font-size="11.5" fill="#64748b">IT lead · Word</text>

  <rect x="220" y="192" width="160" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="300" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">6  SIT QA Strategy</text>
  <text x="300" y="243" text-anchor="middle" font-size="11.5" fill="#64748b">QA lead · Word</text>

  <rect x="420" y="192" width="160" height="72" rx="8" fill="#ffffff" stroke="#cbd5e1"/>
  <text x="500" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#1e293b">7  UAT QA Strategy</text>
  <text x="500" y="243" text-anchor="middle" font-size="11.5" fill="#64748b">UAT lead · Word</text>

  <rect x="620" y="192" width="200" height="72" rx="8" fill="#eff6ff" stroke="#3b82f6"/>
  <text x="720" y="222" text-anchor="middle" font-size="15" font-weight="600" fill="#1e3a8a">Planview / PPP files</text>
  <text x="720" y="243" text-anchor="middle" font-size="11.5" fill="#1d4ed8">Word, Excel and the RTM with T2BAU</text>

  <line x1="180" y1="228" x2="216" y2="228" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="380" y1="228" x2="416" y2="228" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <line x1="580" y1="228" x2="616" y2="228" stroke="#64748b" stroke-width="1.6" marker-end="url(#arrow)"/>
  <use href="#gate" x="200" y="228"/>
  <use href="#gate" x="400" y="228"/>
  <use href="#gate" x="600" y="228"/>

  <!-- Legend -->
  <line x1="20" y1="296" x2="980" y2="296" stroke="#e2e8f0"/>
  <use href="#gate" x="34" y="326"/>
  <text x="56" y="322" font-size="13" font-weight="600" fill="#1e293b">Review gate</text>
  <text x="56" y="342" font-size="12.5" fill="#475569">Checks run on the draft, then the named owner approves it, sends it back or edits it. A blocking check stops approval.</text>
  <text x="56" y="360" font-size="12.5" fill="#475569">Each step reads only approved deliverables. Formal approval and storage then happen in Planview or PPP.</text>
</svg>
