# Sample project with made-up data. Copy this folder to start a new project.
name: Commercial Loan Policy Check
type: migration            # new-build | migration | enhancement
templatePack: standard     # a folder under content/templates/

# MUFG PDLC Planning-phase deliverables, in the order they are written.
# Each step waits for the one before it to be approved.
stageOrder: [intake, brd, fdd, dsd, tdd, sit-strategy, uat-strategy]

# Who approves each deliverable. Defaults until MUFG confirms its approvers.
owners:
  intake: Project manager
  brd: Business analyst
  fdd: IT lead
  dsd: IT lead
  tdd: IT lead
  sit-strategy: QA lead
  uat-strategy: UAT lead

# Optional limits. Leave them out and the tool sizes requests from the chosen model,
# writes a long FDD or TDD in pieces, and fills any gaps automatically.
budget:
  # maxInputTokens: 60000  # cap one request below the model's own limit
  # maxOutputTokens: 8000  # how long one reply can safely be (the default)
  # chunkSize: 10          # fix the piece size: requirements per FDD piece, design items per TDD piece
